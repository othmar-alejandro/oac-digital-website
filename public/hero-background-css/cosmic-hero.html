<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAC Digital Innovations</title>
    <link rel="stylesheet" href="cosmic-hero.css">
</head>

<body>
    <div class="hero-container">
        <!-- Stars effect layers -->
        <div class="stars-layer stars-1"></div>
        <div class="stars-layer stars-2"></div>

        <!-- Grid overlay -->
        <div class="grid-overlay"></div>

        <!-- Aurora arch effects -->
        <div class="aurora-container">
            <div class="aurora-main"></div>
            <div class="aurora-inner"></div>
            <div class="aurora-glow"></div>
        </div>

        <!-- Light bands for depth -->
        <div class="light-bands"></div>

        <!-- Content -->
        <div class="hero-content">
            <h1 class="hero-title">Digital Innovation & Excellence</h1>
            <p class="hero-subtitle">Transforming ideas into exceptional digital experiences with cutting-edge
                technology and creative solutions.</p>
            <button class="cta-button">Explore Our Services</button>
        </div>
    </div>
</body>

</html>
