<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hero Background</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional styles for demo content */
        .hero-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            z-index: 10;
            color: white;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .hero-content p {
            font-size: 1.25rem;
            max-width: 600px;
            margin-bottom: 2rem;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
        }

        .hero-button {
            background-color: var(--color-primary);
            color: #000;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .hero-button:hover {
            background-color: var(--color-accent-light);
            transform: translateY(-2px);
        }

        .logo {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-primary);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .nav {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 1.5rem;
        }

        .nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .nav a:hover {
            color: var(--color-accent-light);
        }
    </style>
</head>

<body>
    <div class="hero-background">
        <div class="aurora-arch"></div>
        <div class="geometric-grid"></div>
        <div class="starfield starfield-far"></div>
        <div class="starfield starfield-mid"></div>
        <div class="starfield starfield-near"></div>

        <!-- Demo content overlay -->
        <div class="logo">OAC Digital</div>
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Portfolio</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
        <div class="hero-content">
            <h1>Digital Innovation & Excellence</h1>
            <p>Transforming ideas into exceptional digital experiences with cutting-edge technology and creative
                solutions.</p>
            <button class="hero-button">Explore Our Services</button>
        </div>
    </div>
</body>

</html>
